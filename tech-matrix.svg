<svg fill="none" width="850" height="260" viewBox="0 0 850 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes borderPulse {
      0% { stroke: #00F2FE; }
      50% { stroke: #FF0055; }
      100% { stroke: #00F2FE; }
    }
    .matrix-card { fill: #0D1117; stroke-width: 2px; animation: borderPulse 6s infinite linear; }
    .label { font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold; fill: #00F2FE; }
    .val { font-family: 'Courier New', monospace; font-size: 12px; fill: #C9D1D9; }
    .led { fill: #39D353; filter: drop-shadow(0px 0px 4px #39D353); }
  </style>

  <rect x="5" y="5" width="840" height="250" rx="10" class="matrix-card" />
  <text x="25" y="35" class="label" style="fill: #39D353;">🛠️ TACTICAL TOOLKIT &amp; SYSTEM CAPABILITIES</text>
  <line x1="25" y1="45" x2="825" y2="45" stroke="#30363D" />

  <!-- Category 1 -->
  <circle cx="35" cy="75" r="4" class="led" />
  <text x="50" y="80" class="label">PROGRAMMING:</text>
  <text x="220" y="80" class="val">Python | C/C++ | JavaScript | HTML5 | CSS3 | Bash/Shell</text>

  <!-- Category 2 -->
  <circle cx="35" cy="120" r="4" class="led" />
  <text x="50" y="125" class="label">OS &amp; SECURITY:</text>
  <text x="220" y="125" class="val">Kali Linux | BlackArch Linux | Arch Linux | Network Analysis</text>

  <!-- Category 3 -->
  <circle cx="35" cy="165" r="4" class="led" />
  <text x="50" y="170" class="label">AEROSPACE &amp; HW:</text>
  <text x="220" y="170" class="val">UAV Architecture | Avionics Design | Circuit &amp; Embedded Systems</text>

  <!-- Category 4 -->
  <circle cx="35" cy="210" r="4" class="led" />
  <text x="50" y="215" class="label">TACTICAL SIM:</text>
  <text x="220" y="215" class="val">Arma 3 Engine &amp; Scripting | Security Bots | Threat Automation</text>
</svg>
