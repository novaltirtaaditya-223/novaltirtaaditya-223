<svg fill="none" width="850" height="920" viewBox="0 0 850 920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filter Glow Neon Cyan Khusus Huruf -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- CLIP PATH (TOPENG) UNTUK ANIMASI KETIK -->
    <clipPath id="typewriterClip">
      <rect x="35" y="60" width="0" height="60">
        <animate attributeName="width" values="0; 450; 450; 0" keyTimes="0; 0.45; 0.85; 1" dur="6s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    /* Animasi Border Frame Utama */
    @keyframes neonShift {
      0% { stroke: #00F2FE; filter: drop-shadow(0px 0px 8px #00F2FE); }
      50% { stroke: #39D353; filter: drop-shadow(0px 0px 8px #39D353); }
      100% { stroke: #00F2FE; filter: drop-shadow(0px 0px 8px #00F2FE); }
    }

    /* Animasi Radar Pulse */
    @keyframes radarPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Animasi Pergerakan Kursor Ketik */
    @keyframes moveCursor {
      0% { transform: translateX(0px); opacity: 1; }
      45% { transform: translateX(430px); opacity: 1; }
      85% { transform: translateX(430px); opacity: 1; }
      100% { transform: translateX(0px); opacity: 0; }
    }

    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .main-card {
      fill: #0D1117;
      stroke-width: 3px;
      animation: neonShift 6s infinite ease-in-out;
    }

    /* TEKS NAMA: PUTIH TEBAL + GLOW + ANIMASI TYPEWRITER */
    .title-bold-white {
      font-family: 'Courier New', Monospace, monospace;
      font-weight: 900;
      font-size: 32px;
      fill: #FFFFFF;
      stroke: #00F2FE;
      stroke-width: 0.8px;
      filter: url(#cyanGlow);
      letter-spacing: 4px;
    }

    .typing-mask {
      clip-path: url(#typewriterClip);
    }

    .cursor-line {
      stroke: #00F2FE;
      stroke-width: 3px;
      animation: moveCursor 6s infinite linear;
      filter: url(#cyanGlow);
    }

    .hud-title {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      font-weight: bold;
      fill: #00F2FE;
    }

    .hud-body {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      fill: #C9D1D9;
    }

    .hud-quote {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      fill: #58A6FF;
      font-style: italic;
    }

    .status-text {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      fill: #39D353;
      animation: radarPulse 2s infinite ease-in-out;
    }

    .led-green { fill: #39D353; filter: url(#greenGlow); }
    .led-cyan { fill: #00F2FE; filter: url(#cyanGlow); }
  </style>

  <!-- Container Utama -->
  <rect x="5" y="5" width="840" height="910" rx="14" class="main-card" />

  <!-- Aksen Sudut Tactical HUD -->
  <path d="M 25 25 L 45 25 L 25 45 Z" fill="#00F2FE" />
  <path d="M 825 25 L 805 25 L 825 45 Z" fill="#00F2FE" />

  <!-- ================= SECTION 1: HEADER & NAMA ================= -->
  <text x="40" y="50" class="status-text">[ SYSTEM: ONLINE ] // [ CLEARANCE: TOP SECRET ] // [ RADAR: ACTIVE ]</text>
  <line x1="40" y1="60" x2="810" y2="60" stroke="#30363D" stroke-width="1" />

  <!-- Teks Nama dengan Animasi Ketik (Topeng ClipPath) -->
  <g class="typing-mask">
    <text x="40" y="105" class="title-bold-white">NOVAL TIRTA ADITYA</text>
  </g>

  <!-- Garis Kursor Berjalan (Efek Ketik Cyan) -->
  <line x1="40" y1="78" x2="40" y2="110" class="cursor-line" />

  <text x="40" y="145" class="hud-title">> AEROSPACE HARDWARE ENGINEER</text>
  <text x="40" y="168" class="hud-title">> UAV &amp; FIGHTER AIRCRAFT SYSTEMS DESIGNER</text>
  <text x="40" y="191" class="hud-title">> OFFENSIVE SECURITY ARCHITECT</text>

  <!-- ================= SECTION 2: BIOGRAPHY ================= -->
  <line x1="40" y1="215" x2="810" y2="215" stroke="#30363D" stroke-width="1" />
  <text x="40" y="245" class="status-text">📡 [OPERATIONAL_BIOGRAPHY] // CORE MISSION</text>

  <text x="40" y="280" class="hud-body">> SPECIALIZATION: Hardware Engineering, UAV/Drone Systems, Airborne Weaponry Integration.</text>
  <text x="40" y="305" class="hud-body">> SECURITY LAB: Penetration Testing, Threat Analysis Automation &amp; Infrastructure Defense.</text>

  <rect x="40" y="325" width="770" height="45" fill="#161B22" rx="6" stroke="#30363D" />
  <line x1="40" y1="325" x2="40" y2="370" stroke="#00F2FE" stroke-width="4" />
  <text x="55" y="352" class="hud-quote">"Designing Next-Gen Tactical Aerospace Hardware &amp; Securing Critical Infrastructure."</text>

  <!-- ================= SECTION 3: TECH STACK MATRIX ================= -->
  <line x1="40" y1="395" x2="810" y2="395" stroke="#30363D" stroke-width="1" />
  <text x="40" y="425" class="hud-title" style="fill: #39D353;">🛠️ TACTICAL TOOLKIT &amp; CAPABILITIES</text>

  <circle cx="50" cy="460" r="4" class="led-green" />
  <text x="65" y="465" class="hud-title">PROGRAMMING:</text>
  <text x="220" y="465" class="hud-body">Python | C/C++ | JavaScript | HTML5 | CSS3 | Bash/Shell</text>

  <circle cx="50" cy="505" r="4" class="led-cyan" />
  <text x="65" y="510" class="hud-title">OS &amp; SECURITY:</text>
  <text x="220" y="510" class="hud-body">Kali Linux | BlackArch Linux | Arch Linux | Network Analysis</text>

  <circle cx="50" cy="550" r="4" class="led-green" />
  <text x="65" y="555" class="hud-title">AEROSPACE/HW:</text>
  <text x="220" y="555" class="hud-body">UAV Architecture | Avionics | Circuit Design | Embedded Systems</text>

  <circle cx="50" cy="595" r="4" class="led-cyan" />
  <text x="65" y="600" class="hud-title">TACTICAL SIM:</text>
  <text x="220" y="600" class="hud-body">Arma 3 Engine &amp; Scripting | Security Bots | Threat Automation</text>

  <!-- ================= SECTION 4: FEATURED LABS ================= -->
  <line x1="40" y1="630" x2="810" y2="630" stroke="#30363D" stroke-width="1" />
  <text x="40" y="660" class="hud-title">🚀 FEATURED RESEARCH &amp; LABS</text>

  <!-- Box 1 -->
  <rect x="40" y="680" width="240" height="170" rx="8" fill="#161B22" stroke="#00F2FE" stroke-width="2" />
  <text x="55" y="710" class="hud-title">🛸 UAV Flight Systems</text>
  <line x1="55" y1="720" x2="265" y2="720" stroke="#30363D" />
  <text x="55" y="745" class="hud-body">Sistem kontrol otonom</text>
  <text x="55" y="765" class="hud-body">UAV &amp; riset aerodinamika</text>
  <text x="55" y="785" class="hud-body">pesawat tempur.</text>

  <!-- Box 2 -->
  <rect x="305" y="680" width="240" height="170" rx="8" fill="#161B22" stroke="#39D353" stroke-width="2" />
  <text x="320" y="710" class="hud-title" style="fill: #39D353;">⚔️ Airborne Weaponry</text>
  <line x1="320" y1="720" x2="530" y2="720" stroke="#30363D" />
  <text x="320" y="745" class="hud-body">Integrasi avionik militer</text>
  <text x="320" y="765" class="hud-body">&amp; arsitektur kontrol</text>
  <text x="320" y="785" class="hud-body">persenjataan udara.</text>

  <!-- Box 3 -->
  <rect x="570" y="680" width="240" height="170" rx="8" fill="#161B22" stroke="#FF0055" stroke-width="2" />
  <text x="585" y="710" class="hud-title" style="fill: #FF0055;">🛡️ Threat Automation</text>
  <line x1="585" y1="720" x2="795" y2="720" stroke="#30363D" />
  <text x="585" y="745" class="hud-body">Otomatisasi analisis</text>
  <text x="585" y="765" class="hud-body">ancaman siber &amp; pengujian</text>
  <text x="585" y="785" class="hud-body">penetrasi sistem.</text>

  <!-- Footer -->
  <line x1="40" y1="875" x2="810" y2="875" stroke="#30363D" stroke-width="1" />
  <text x="40" y="895" class="status-text">TACTICAL HUD V2.4 // "Precision Engineering, Flawless Execution"</text>
</svg>
