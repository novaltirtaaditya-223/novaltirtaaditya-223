<svg fill="none" width="850" height="200" viewBox="0 0 850 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes neonGlow {
      0%, 100% { stroke: #39D353; filter: drop-shadow(0px 0px 6px #39D353); }
      50% { stroke: #00F2FE; filter: drop-shadow(0px 0px 6px #00F2FE); }
    }
    .hud-card { fill: #0D1117; stroke-width: 2px; animation: neonGlow 5s infinite ease-in-out; }
    .hud-header { font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; fill: #39D353; }
    .hud-body { font-family: 'Courier New', monospace; font-size: 12px; fill: #C9D1D9; }
    .hud-quote { font-family: 'Courier New', monospace; font-size: 12px; fill: #58A6FF; font-style: italic; }
  </style>

  <rect x="5" y="5" width="840" height="190" rx="10" class="hud-card" />
  
  <text x="25" y="35" class="hud-header">📡 [OPERATIONAL_BIOGRAPHY] // CORE MISSION</text>
  <line x1="25" y1="45" x2="825" y2="45" stroke="#30363D" />

  <text x="25" y="75" class="hud-body">> SPECIALIZATION: Hardware Engineering, UAV/Drone Systems, Airborne Weaponry Integration.</text>
  <text x="25" y="100" class="hud-body">> SECURITY LAB: Penetration Testing, Threat Analysis Automation &amp; Critical Infrastructure Defense.</text>

  <!-- Quote Box -->
  <rect x="25" y="120" width="800" height="45" fill="#161B22" rx="5" />
  <line x1="25" y1="120" x2="25" y2="165" stroke="#00F2FE" stroke-width="4" />
  <text x="40" y="147" class="hud-quote">"Designing Next-Gen Tactical Aerospace Hardware &amp; Securing Critical Infrastructure."</text>
</svg>
