<svg fill="none" width="850" height="240" viewBox="0 0 850 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filter Efek Pendaran Cahaya Neon Cyan di Sekitar Teks -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Animasi Pergeseran Warna Border Neon */
    @keyframes neonShift {
      0% { stroke: #00F2FE; filter: drop-shadow(0px 0px 8px #00F2FE); }
      50% { stroke: #39D353; filter: drop-shadow(0px 0px 8px #39D353); }
      100% { stroke: #00F2FE; filter: drop-shadow(0px 0px 8px #00F2FE); }
    }

    /* Animasi Ketik (Typewriter) */
    @keyframes typing {
      from { width: 0; }
      to { width: 440px; }
    }

    /* Animasi Kursor Berkedip */
    @keyframes blinkCursor {
      0%, 100% { border-right-color: #00F2FE; }
      50% { border-right-color: transparent; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .main-card {
      fill: #0D1117;
      stroke-width: 3px;
      animation: neonShift 6s infinite ease-in-out;
    }

    /* Container untuk Mengatur Animasi Ketik & Warna Teks PUTIH */
    .typing-container {
      width: 0;
      animation: typing 3.5s steps(20, end) infinite alternate;
      overflow: hidden;
      white-space: nowrap;
      border-right: 3px solid #00F2FE;
      animation-name: typing, blinkCursor;
      animation-duration: 3.5s, 0.75s;
      animation-timing-function: steps(20, end), step-end;
      animation-iteration-count: infinite, infinite;
      animation-direction: alternate, normal;
    }

    /* KUNCI WARNA PUTIH TEKS DENGAN GLOW CYAN */
    .title-white {
      font-family: 'Courier New', Monospace, monospace;
      font-weight: bold;
      font-size: 28px;
      color: #FFFFFF !important; /* Memaksa warna menjadi PUTIH */
      text-shadow: 0px 0px 10px #00F2FE, 0px 0px 20px #00F2FE; /* Efek Pendaran Neon Cyan */
      letter-spacing: 3px;
      display: inline-block;
    }

    .tagline-text {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      fill: #00F2FE;
    }

    .status-text {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      fill: #39D353;
      animation: pulse 2s infinite ease-in-out;
    }
  </style>

  <!-- Card Utama Background Dark Slate -->
  <rect x="5" y="5" width="840" height="230" rx="12" class="main-card" />

  <!-- Aksen Sudut Tactical HUD -->
  <path d="M 25 25 L 45 25 L 25 45 Z" fill="#00F2FE" />
  <path d="M 825 25 L 805 25 L 825 45 Z" fill="#00F2FE" />

  <!-- Header Status Bar -->
  <text x="40" y="50" class="status-text">[ SYSTEM: ONLINE ] // [ CLEARANCE: TOP SECRET ] // [ RADAR: ACTIVE ]</text>
  <line x1="40" y1="60" x2="810" y2="60" stroke="#30363D" stroke-width="1" />

  <!-- Nama "NOVAL TIRTA ADITYA" Warna PUTIH + Animasi Ketik -->
  <g transform="translate(40, 80)">
    <foreignObject width="770" height="50">
      <div xmlns="http://www.w3.org/1999/xhtml" class="typing-container">
        <span class="title-white">NOVAL TIRTA ADITYA</span>
      </div>
    </foreignObject>
  </g>

  <!-- Tagline Deskripsi -->
  <text x="40" y="145" class="tagline-text">> AEROSPACE HARDWARE ENGINEER</text>
  <text x="40" y="168" class="tagline-text">> UAV &amp; FIGHTER AIRCRAFT SYSTEMS DESIGNER</text>
  <text x="40" y="191" class="tagline-text">> OFFENSIVE SECURITY ARCHITECT</text>

  <!-- Footer Line -->
  <line x1="40" y1="205" x2="810" y2="205" stroke="#30363D" stroke-width="1" />
</svg>
